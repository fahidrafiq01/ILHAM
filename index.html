<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something for you 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,300;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#15112b;--dusk:#3a2358;--glow:#ffb86b;--rose:#ff8fa3;--paper:#fff4e4;--ink:#2d2036;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 105%,var(--dusk),var(--night) 65%);color:var(--paper);font-family:'Fraunces',Georgia,serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.stage{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#intro{text-align:center;transition:opacity .9s,transform .9s}
#intro.gone{opacity:0;transform:scale(.9);pointer-events:none;position:absolute}
.lantern{all:unset;cursor:pointer;display:block;margin:0 auto 28px;width:110px;height:140px;position:relative;animation:sway 4s ease-in-out infinite;border-radius:12px}
.lantern:focus-visible{outline:3px solid var(--rose);outline-offset:8px}
.lantern .body{position:absolute;inset:18px 6px 14px;border-radius:44% 44% 38% 38%;background:radial-gradient(circle at 50% 55%,#fff1c9,var(--glow) 55%,#d9703a);box-shadow:0 0 60px 18px rgba(255,184,107,.55),0 0 140px 50px rgba(255,143,163,.25);animation:pulse 2.6s ease-in-out infinite}
.lantern .cap{position:absolute;left:22px;right:22px;height:14px;background:#4a2d3a;border-radius:6px}
.lantern .cap.t{top:8px}.lantern .cap.b{bottom:4px}
.lantern::before{content:"";position:absolute;left:50%;top:-60px;width:2px;height:68px;background:#7a5a6a}
@keyframes sway{50%{transform:rotate(3deg)}0%,100%{transform:rotate(-3deg)}}
@keyframes pulse{50%{filter:brightness(1.18)}}
h1{font-weight:300;font-style:italic;font-size:clamp(1.7rem,6vw,2.6rem);margin:0 0 10px;line-height:1.2}
.hint{font-family:'Caveat',cursive;font-size:1.6rem;color:var(--glow);margin:0}
#letter{display:none;max-width:560px;width:100%;background:var(--paper);color:var(--ink);border-radius:6px 22px 6px 22px;padding:clamp(24px,6vw,44px);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 90px rgba(255,184,107,.25);transform:rotate(-1deg);max-height:88%;overflow:auto}
#letter.show{display:block;animation:open 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes open{from{opacity:0;transform:translateY(40px) scale(.92) rotate(-4deg)}}
#text p{font-family:'Caveat',cursive;font-weight:500;font-size:clamp(1.45rem,5.2vw,1.95rem);line-height:1.3;margin:0 0 .55em}
#text p.big{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(1.3rem,4.6vw,1.7rem);color:#8a2f55}
#text p.sign{text-align:right;margin-top:1em}
.cur::after{content:"|";margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#reply{all:unset;cursor:pointer;display:none;margin:18px auto 0;padding:12px 24px;border-radius:999px;background:var(--rose);color:#3b0f24;font-family:'Fraunces',serif;font-weight:500;font-size:1.05rem;text-align:center}
#reply:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#reply.show{display:block}
#after{display:none;text-align:center;font-family:'Caveat',cursive;font-size:1.6rem;margin-top:14px;color:#8a2f55}
@media (prefers-reduced-motion:reduce){.lantern,.lantern .body{animation:none}#letter.show{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main class="stage">
  <section id="intro">
    <button class="lantern" id="lantern" aria-label="Open your surprise"><span class="cap t"></span><span class="body"></span><span class="cap b"></span></button>
    <h1 id="hello">I made this for you</h1>
    <p class="hint">tap the light</p>
  </section>
  <article id="letter" aria-live="polite">
    <div id="text"></div>
    <button id="reply" type="button">Send a heart back</button>
    <div id="after">Screenshot this and send it to me 🤍</div>
  </article>
</main>
<script>
(function(){
  var name="Ilham";
  try{var h=decodeURIComponent(location.hash.slice(1)).replace(/[_\-~.]+/g," ").trim();if(h)name=h.slice(0,24);}catch(e){}
  document.getElementById("hello").textContent="I made this for you, "+(name==="my friend"?"friend":name);

  var cv=document.getElementById("c"),cx=cv.getContext("2d"),W,H,dots=[],hearts=[];
  var calm=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}
  size();addEventListener("resize",size);
  for(var i=0;i<60;i++)dots.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.8,s:Math.random()*.0004+.0001,p:Math.random()*6.28});
  function frame(t){
    cx.clearRect(0,0,W,H);
    dots.forEach(function(d){
      d.y-=d.s;if(d.y<-.05){d.y=1.05;d.x=Math.random()}
      var a=.35+.55*Math.sin(t/700+d.p);
      cx.beginPath();cx.fillStyle="rgba(255,200,120,"+a+")";cx.shadowColor="#ffb86b";cx.shadowBlur=14;
      cx.arc(d.x*W+Math.sin(t/2000+d.p)*18,d.y*H,d.r*devicePixelRatio,0,6.28);cx.fill();
    });
    cx.shadowBlur=0;
    hearts=hearts.filter(function(o){return o.y>-40});
    hearts.forEach(function(o){
      o.y-=o.v;o.x+=Math.sin(o.y/40+o.p)*.8;
      cx.font=o.s+"px serif";cx.globalAlpha=Math.max(0,Math.min(1,o.y/(H*.5)));cx.fillText("🤍",o.x,o.y);cx.globalAlpha=1;
    });
    if(!calm)requestAnimationFrame(frame);
  }
  if(calm){frame(0)}else requestAnimationFrame(frame);

  var lines=[
    ["Hey "+name+".",""],
    ["I made this little corner of the internet just for you.",""],
    ["Warning: this message is checked by a future physiotherapist (1st semester, so please be gentle). 🩺",""],
    ["I tried to learn all 206 bones for you. I only remember the funny bone, and it isn't even a bone. 😭",""],
    ["I wanted to call you my backbone, but you'd correct me: it's the vertebral column. 🦴",""],
    ["Also, my posture is terrible and I'm not paying for a consultation.",""],
    ["Some people walk into your life and quietly make everything lighter.",""],
    ["You're one of them.","big"],
    ["Thank you for the late talks, the laughs that hurt, and for staying when I wasn't easy to be around.",""],
    ["Wherever life takes us, I'm so glad it put you next to me.",""],
    ["If nobody told you today: you matter. A lot. To me, definitely.","big"],
    ["Prescription, Dr. Ilham: 1 hug, 2 laughs, repeat daily. No refunds. 💊",""],
    ["Always your friend 🤍","sign"]
  ];
  var box=document.getElementById("text"),letter=document.getElementById("letter");
  var started=false;
  function type(li){
    if(li>=lines.length){document.getElementById("reply").classList.add("show");return}
    var p=document.createElement("p");if(lines[li][1])p.className=lines[li][1];
    p.classList.add("cur");box.appendChild(p);
    var s=lines[li][0],i=0;
    (function step(){
      if(calm){p.textContent=s;p.classList.remove("cur");setTimeout(function(){type(li+1)},300);return}
      p.textContent=s.slice(0,++i);letter.scrollTop=letter.scrollHeight;
      if(i<s.length)setTimeout(step,38);
      else{p.classList.remove("cur");setTimeout(function(){type(li+1)},650)}
    })();
  }
  document.getElementById("lantern").addEventListener("click",function(){
    if(started)return;started=true;
    document.getElementById("intro").classList.add("gone");
    setTimeout(function(){letter.classList.add("show");type(0)},700);
  });
  document.getElementById("reply").addEventListener("click",function(){
    this.style.display="none";document.getElementById("after").style.display="block";
    for(var i=0;i<28;i++)hearts.push({x:Math.random()*W,y:H+Math.random()*H*.4,v:(Math.random()*2+1.5)*devicePixelRatio,s:(Math.random()*22+18)*devicePixelRatio,p:Math.random()*6});
    if(calm)frame(0);
  });
})();
</script>
</body>
</html>
